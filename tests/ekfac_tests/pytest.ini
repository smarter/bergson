[pytest]
# Pytest configuration for EKFAC tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    requires_test_data: marks tests as requiring test data files (deselect with '-m "not requires_test_data"')
    requires_gpu: marks tests as requiring GPU (deselect with '-m "not requires_gpu"')
    slow: marks tests as slow running (deselect with '-m "not slow"')
    smoke: marks tests as fast smoke tests that run on CPU without test data (select with '-m "smoke"')

# Output options
addopts =
    -v
    --tb=short
    --strict-markers

# Minimum version
minversion = 6.0
