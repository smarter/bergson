# Hydra configuration for K-FAC experiments
# Usage:
#   dvc exp run -S model=7b -S method=bergson
#   dvc exp run --queue -S 'model=1b,7b' -S 'method=original,bergson'

defaults:
  - model: 7b
  - method: bergson
  - benchmark: gsm8k
  - _self_


fsdp: false
world_size: null  # Set to number of GPUs

collect_kfac:
  sample_labels: true
  args:
    device: "cuda"
    dtype: "bfloat16"
    corpus: "dolmo"
    nbytes: 100000000  # ~100MB (~20M tokens)
    seq_len: 512
    target_blocks: ${oc.dict.keys:eval_kfac.layers}
    layers_per_pass: ${len:${eval_kfac.layers}}

eval_kfac:
  _layers:
    "7b":
      "goodfire":
        # From the Goodfire paper (Appendix D)
        {"23": {"gate": 0.60, "up": 0.60, "down": 1.0}, "24": {"gate": 0.60, "up": 0.60, "down": 1.0}, "25": {"gate": 0.60, "up": 0.60, "down": 1.0}}
      "bergson":
        # Tuned to approximately match goodfire wrt to the numbers of preserved eigenvalues
        {"23": {"gate": 0.40, "up": 0.40, "down": 1.0}, "24": {"gate": 0.40, "up": 0.40, "down": 1.0}, "25": {"gate": 0.40, "up": 0.40, "down": 1.0}}
    "1b":
      "goodfire":
        # Not specified in the paper, doesn't work well as-is.
        {"13": {"gate": 0.60, "up": 0.60, "down": 1.0}, "14": {"gate": 0.60, "up": 0.60, "down": 1.0}, "15": {"gate": 0.60, "up": 0.60, "down": 1.0}}
      "bergson":
        # Untuned
        {"13": {"gate": 0.40, "up": 0.40, "down": 1.0}, "14": {"gate": 0.40, "up": 0.40, "down": 1.0}, "15": {"gate": 0.40, "up": 0.40, "down": 1.0}}
  layers: ${._layers[${model.size}][${method.name}]}
  args:
    model-size: ${model.size}
    results-tag: ${model.size}
    layers-json: ${json:${..layers}}



# Common output suffix and directories
out_suffix: "${method.name}/${model.size}"
out_dir:
  collect_kfac: "out/collect_kfac/${out_suffix}"
  eval_kfac: "out/eval_kfac/${out_suffix}"
  plot_figure2: "out/plot_figure2/${out_suffix}"
  benchmark: "out/benchmark/${out_suffix}"

# Computed command-line flags (using resolvers from hydra_plugins/resolvers.py)
computed:
  eigenvalue_corrections_flag: "${if:${method.use_eigenvalue_corrections},'--eigenvalue-corrections',''}"
  sample_labels_flag: "${if:${collect_kfac.sample_labels},'--sample_labels',''}"
  fsdp_flag: "${if:${fsdp},'--fsdp',''}"
  world_size_flag: "${if_set:${world_size},'--world_size'}"
