# Hydra configuration for K-FAC experiments
# Usage:
#   dvc exp run -S model=7b -S method=bergson
#   dvc exp run --queue -S 'model=1b,7b' -S 'method=original,bergson'

defaults:
  - model: 7b
  - method: bergson
  - _self_

# Shared collection parameters
collect_kfac:
  device: "cuda"
  dtype: "bfloat16"
  corpus: "dolmo"
  nbytes: 100000000  # ~100MB (~20M tokens)
  seq_len: 512
  layers_per_pass: 1
  sample_labels: true

# Multi-GPU settings (bergson only)
fsdp: false
world_size: null  # Set to number of GPUs

# K-FAC Edit Parameters
kfac_edit:
  batch_size: 96  # Batch size for evaluation

# Computed command-line flags (using resolvers from hydra_plugins/resolvers.py)
computed:
  # Method flags
  bergson_factors_arg: "${if:${method.use_bergson},'--bergson-factors ${method.factors_dir}/olmo2_${model.size}',''}"
  eigenvalue_corrections_flag: "${if:${method.use_eigenvalue_corrections},'--eigenvalue-corrections',''}"
  # Collection flags
  sample_labels_flag: "${if:${collect_kfac.sample_labels},'--sample_labels',''}"
  fsdp_flag: "${if:${fsdp},'--fsdp',''}"
  world_size_flag: "${if_set:${world_size},'--world_size'}"

# Benchmark Evaluation Parameters (using olmes)
benchmark:
  model: "olmo-2-7b-1124"
  task: "gsm8k::olmes"
  output_dir: "memorization_kfac/benchmarks"
  olmes_commit: "f122a7bad99551ffb3f5feec14169af794926f6b"
  batch_size: 8
