model:
  name: allenai/OLMo-2-1124-7B
  size: 7b
collect_kfac:
  args:
    batch_size: 24
    device: cuda
    dtype: bfloat16
    corpus: dolmo
    nbytes: 100000000
    seq_len: 512
    target_blocks:
    - '23'
    - '24'
    - '25'
    layers_per_pass: 3
  script: memorization_kfac/data/collect_kfac_bergson.py
  sample_labels: true
eval_kfac:
  args:
    bs: 96
    bergson-factors: out/collect_kfac/bergson/7b
    layers-json: '{"23": {"gate": 0.4, "up": 0.4, "down": 1.0}, "24": {"gate": 0.4,
      "up": 0.4, "down": 1.0}, "25": {"gate": 0.4, "up": 0.4, "down": 1.0}}'
  use_eigenvalue_corrections: true
method:
  name: bergson
benchmark:
  args:
    task: gsm8k::olmes
    batch-size: 32
model_method:
  layers:
    '23':
      gate: 0.4
      up: 0.4
      down: 1.0
    '24':
      gate: 0.4
      up: 0.4
      down: 1.0
    '25':
      gate: 0.4
      up: 0.4
      down: 1.0
fsdp: false
world_size: null
out_suffix: bergson/7b
out_dir:
  collect_kfac: out/collect_kfac/bergson/7b
  eval_kfac: out/eval_kfac/bergson/7b
  plot_figure2: out/plot_figure2/bergson/7b
  benchmark: out/benchmark/bergson/7b
computed:
  eigenvalue_corrections_flag: --eigenvalue-corrections
  sample_labels_flag: --sample_labels
  fsdp_flag: ''
  world_size_flag: ''
