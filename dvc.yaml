stages:
  # =============================================================================
  # Data Preparation
  # =============================================================================

  prepare_pile10k:
    cmd:
      - python memorization_kfac/data/prepare_pile10k.py
    deps:
      - memorization_kfac/data/prepare_pile10k.py
    outs:
      - memorization_kfac/data/pile10k_None.txt
    desc: |
      Download and prepare pile10k dataset from HuggingFace (NeelNanda/pile-10k).
      This dataset is used for nDCG evaluation in the validation stages.

  prepare_pile10k_cache:
    cmd:
      - python memorization_kfac/data/prepare_pile10k_cache.py
    deps:
      - memorization_kfac/data/prepare_pile10k_cache.py
      - memorization_kfac/data/pile10k_None.txt
    outs:
      - memorization_kfac/evaluations/bsn_dependencies/data/olmo2_clean_pt_cache_112.pt
    desc: |
      Generate pre-tokenized cache for pile10k perplexity evaluation.
      Creates a .pt file with tokenized pile10k data in blocks of size 112.
      This is used for BSN-style perplexity evaluation.

  # =============================================================================
  # K-FAC Factor Collection
  # =============================================================================
  # Unified task using Hydra config groups for model and method selection.
  #
  # Usage:
  #   dvc exp run collect_kfac -S model=7b -S method=bergson
  #   dvc exp run collect_kfac -S model=1b -S method=original
  #   dvc exp run --queue -S 'model=1b,7b' -S 'method=original,bergson'

  collect_kfac:
    cmd: >-
      python ${method.collect_script}
      --model ${model.name}
      --device ${collect_kfac.device}
      --dtype ${collect_kfac.dtype}
      --corpus ${collect_kfac.corpus}
      --nbytes ${collect_kfac.nbytes}
      --seq_len ${collect_kfac.seq_len}
      --batch_size ${model.collect_batch_size}
      --layers_per_pass ${collect_kfac.layers_per_pass}
      --target_blocks ${model.target_blocks}
      --save_dir ${method.factors_dir}/olmo2_${model.size}
      ${computed.sample_labels_flag}
      ${computed.fsdp_flag}
      ${computed.world_size_flag}
    deps:
      - ${method.collect_script}
    outs:
      - ${method.factors_dir}/olmo2_${model.size}
    desc: |
      Collect K-FAC factors for the specified model and method.

      Config groups (in conf/):
      - model: 1b, 7b (sets model name, target layers, batch size)
      - method: original, bergson (sets collection script and output dirs)

      Usage:
        dvc exp run collect_kfac -S model=7b -S method=bergson

  # =============================================================================
  # K-FAC Weight Editing & Evaluation
  # =============================================================================
  # Unified task for applying K-FAC edits and evaluating memorization.
  #
  # Usage:
  #   dvc exp run eval_kfac -S model=7b -S method=bergson
  #   dvc exp run eval_kfac -S model=1b -S method=original

  eval_kfac:
    cmd: >-
      MEM_KFAC_FACTORS_ROOT=${method.factors_dir}
      MEM_KFAC_CACHE_DIR=${method.cache_dir}_${model.size}
      python memorization_kfac/evaluations/eval_mem_kfac.py
      --model-size ${model.size}
      --layers-json ${model.layers_json}
      --use-cache --refresh-cache
      --perplexity
      --bs ${kfac_edit.batch_size}
      --results-dir ${method.metrics_dir}
      --results-tag ${model.size}
      ${computed.bergson_factors_arg}
      ${computed.eigenvalue_corrections_flag}
    deps:
      - memorization_kfac/evaluations/eval_mem_kfac.py
      - ${method.factors_dir}/olmo2_${model.size}
      - memorization_kfac/data/pile10k_None.txt
      - memorization_kfac/evaluations/bsn_dependencies/data/olmo2_clean_pt_cache_112.pt
    outs:
      - ${method.cache_dir}_${model.size}
    metrics:
      - ${method.metrics_dir}/kfac_eval_log_${model.size}_${model.size}.jsonl
    desc: |
      Apply K-FAC weight editing and evaluate memorization.

      Config groups (in conf/):
      - model: 1b, 7b (sets model size, target layers config)
      - method: original, bergson (sets factors dir, cache dir, metrics dir)

      Usage:
        dvc exp run eval_kfac -S model=7b -S method=bergson

      Evaluates:
      - Memorization (Dolma & Quotes datasets)
      - Perplexity (Pile 10k)
      - nDCG@10

  # =============================================================================
  # Result Validation
  # =============================================================================

  validate_results:
    cmd: >-
      python memorization_kfac/evaluations/validate_paper_results.py
      --results-file ${method.metrics_dir}/kfac_eval_log_${model.size}_${model.size}.jsonl
      --model-size ${model.size}
      --tolerance 0.05
      --output ${method.metrics_dir}/validation_${model.size}.json
    deps:
      - memorization_kfac/evaluations/validate_paper_results.py
      - ${method.metrics_dir}/kfac_eval_log_${model.size}_${model.size}.jsonl
    metrics:
      - ${method.metrics_dir}/validation_${model.size}.json
    desc: |
      Validate results against paper values.

      Usage:
        dvc exp run validate_results -S model=7b -S method=bergson

  # =============================================================================
  # Figure 2: K-FAC Eigenvector Activation Ratios
  # =============================================================================

  plot_figure2:
    cmd: >-
      python memorization_kfac/evaluations/plot_figure2_activation_ratios.py
      --model-size ${model.size}
      --kfac-dir ${method.factors_dir}/olmo2_${model.size}
      --projection up
      --n-samples 100
      --batch-size 8
      --output-dir memorization_kfac/plots/figure2_${model.size}
    deps:
      - memorization_kfac/evaluations/plot_figure2_activation_ratios.py
      - ${method.factors_dir}/olmo2_${model.size}
    plots:
      - memorization_kfac/plots/figure2_${model.size}
    desc: |
      Generate Figure 2: K-FAC eigenvector activation ratios.

      Usage:
        dvc exp run plot_figure2 -S model=7b -S method=original

  # =============================================================================
  # Benchmark Evaluation (using olmes)
  # =============================================================================

  benchmark:
    cmd: >-
      uvx --from "ai2-olmes[gpu] @ git+https://github.com/allenai/olmes.git@${benchmark.olmes_commit}"
      olmes
      --model ${benchmark.model}
      --task ${benchmark.task}
      --batch-size ${benchmark.batch_size}
      --output-dir ${benchmark.output_dir}/${benchmark.task}
      && python memorization_kfac/evaluations/extract_olmes_metrics.py ${benchmark.output_dir}/${benchmark.task}/metrics.json ${benchmark.output_dir}/${benchmark.task}.metrics.json
    outs:
      - ${benchmark.output_dir}/${benchmark.task}
    metrics:
      - ${benchmark.output_dir}/${benchmark.task}.metrics.json
    desc: |
      Run benchmark evaluation using OLMES with vLLM support.

      Supported tasks:
      - gsm8k::olmes - Grade school math (8-shot)
      - winogrande::olmes - Commonsense reasoning

      The model parameter can be:
      - A HuggingFace model ID (e.g., allenai/OLMo-2-0425-1B)
      - A local path to an edited model saved by eval_mem_kfac.py

      Example with edited model:
        dvc repro benchmark -S benchmark.model=memorization_kfac/edited_models/models_kfac/7b/...

      Uses uvx to run olmes in an isolated environment, avoiding dependency
      conflicts with the main project (olmes requires fsspec==2023.5.0,
      which conflicts with dvc). Includes [gpu] extras for vLLM acceleration.

      Output: metrics.json contains primary_score and detailed metrics (acc_raw, etc.)
      View with: dvc metrics show
