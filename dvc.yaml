stages:
  # =============================================================================
  # K-FAC Factor Collection (Paper Section 3.2, Equation 1)
  # =============================================================================
  # Reproduces: "We collect these factors for the MLP projections (gate_proj,
  # up_proj, down_proj) by streaming ~20M tokens from Dolmino/OLMo mixtures
  # with sequence length 512 under next-token cross-entropy."

  collect_kfac_bergson:
    cmd: >-
      python memorization_kfac/data/collect_kfac_bergson.py
      --model ${model.name}
      --device ${collect_kfac.device}
      --dtype ${collect_kfac.dtype}
      --corpus ${collect_kfac.corpus}
      --nbytes ${collect_kfac.nbytes}
      --seq_len ${collect_kfac.seq_len}
      --batch_size ${collect_kfac.batch_size}
      --layers_per_pass ${collect_kfac.layers_per_pass}
      --target_blocks ${collect_kfac.target_blocks}
      --save_dir memorization_kfac/data/kfac_factors_bergson
      --kfac-only
      ${collect_kfac.sample_labels}
    deps:
      - memorization_kfac/data/collect_kfac_bergson.py
      - bergson/hessians/collector.py
      - bergson/hessians/sharded_computation.py
    params:
      - model.name
      - collect_kfac
    outs:
      - memorization_kfac/data/kfac_factors_bergson
    desc: |
      Paper Section 3.2: Collect K-FAC factors using bergson's implementation.
      Streams ~20M tokens (--nbytes 100000000) from Dolmino/OLMo mixtures
      with sequence length 512. Computes activation (A) and gradient (G)
      covariance matrices for MLP projections.

  collect_kfac_factors:
    cmd:
      - python memorization_kfac/data/collect_kfac_multilayer.py
        --model ${model.name}
        --device ${collect_kfac.device}
        --dtype ${collect_kfac.dtype}
        --corpus ${collect_kfac.corpus}
        --nbytes ${collect_kfac.nbytes}
        --seq_len ${collect_kfac.seq_len}
        --batch_size ${collect_kfac.batch_size}
        --layers_per_pass ${collect_kfac.layers_per_pass}
        --target_blocks ${collect_kfac.target_blocks}
        --save_dir "memorization_kfac/data/kfac_factors/olmo2_${model.size}"
        ${collect_kfac.sample_labels}
    deps:
      - memorization_kfac/data/collect_kfac_multilayer.py
    outs:
      - "memorization_kfac/data/kfac_factors/olmo2_${model.size}"
    desc: |
      Paper Section 3.2: Original K-FAC collection implementation.
      Collects A = E[aa^T] (activation covariance) and G = E[gg^T]
      (gradient covariance) for MLP projections in target layers.

  # =============================================================================
  # K-FAC Weight Editing (Paper Section 5, Table 1)
  # =============================================================================
  # Reproduces Table 1: "In LMs we edit layers 23, 24, and 25 at 60% energy
  # retained in the up and gate projections in MLPs."

  apply_kfac_edit_7b:
    cmd: >-
      python memorization_kfac/evaluations/apply_kfac_edit.py
      --model ${model.name}
      --kfac_dir "memorization_kfac/data/kfac_factors/olmo2_${model.size}"
      --output_dir memorization_kfac/models/kfac_edited_7b
      --layers 23 24 25
      --energy_threshold 0.60
      --projections up gate
    deps:
      - memorization_kfac/evaluations/apply_kfac_edit.py
      - "memorization_kfac/data/kfac_factors/olmo2_${model.size}"
    params:
      - model.name
      - model.size
    outs:
      - memorization_kfac/models/kfac_edited_7b
    desc: |
      Paper Table 1 (Section 5.2): Apply K-FAC edit to OLMo-2 7B.
      Settings from Appendix D.1: "In LMs we edit layers 23, 24, and 25
      at 60% energy retained in the up and gate projections in MLPs."
      This produces the K-FAC edited model evaluated in Table 1.

  apply_kfac_edit_1b:
    cmd: >-
      python memorization_kfac/evaluations/apply_kfac_edit.py
      --model ${model.name}
      --kfac_dir "memorization_kfac/data/kfac_factors/olmo2_${model.size}"
      --output_dir memorization_kfac/models/kfac_edited_1b
      --layers ${kfac_edit.layers_1b}
      --energy_threshold ${kfac_edit.energy_1b}
      --projections up gate
    deps:
      - memorization_kfac/evaluations/apply_kfac_edit.py
      - "memorization_kfac/data/kfac_factors/olmo2_${model.size}"
    params:
      - model.name
      - model.size
      - kfac_edit.layers_1b
      - kfac_edit.energy_1b
    outs:
      - memorization_kfac/models/kfac_edited_1b
    desc: |
      Paper Table 1 (Appendix F): Apply K-FAC edit to OLMo-2 1B.
      Settings for 1B model from supplementary materials.

  # =============================================================================
  # Memorization Dataset Generation (Paper Appendix B)
  # =============================================================================
  # Reproduces: "Fixed-length windows [64 | 48] are sampled per document and
  # a window is labeled memorized iff the teacher-forced argmax at each of
  # the 48 suffix positions equals the gold token."

  mine_dolma_memorization_7b:
    cmd: >-
      python memorization_kfac/data/mine_memorized_sequences.py
      --model ${model.name}
      --corpus dolma
      --prefix_len 64
      --suffix_len 48
      --n_sequences 1000
      --output memorization_kfac/data/dolma_memorized_7b.json
      --split_ratio 0.5
    deps:
      - memorization_kfac/data/mine_memorized_sequences.py
    params:
      - model.name
    outs:
      - memorization_kfac/data/dolma_memorized_7b.json
      - memorization_kfac/data/dolma_memorized_7b_train.json
      - memorization_kfac/data/dolma_memorized_7b_val.json
    desc: |
      Paper Appendix B (Dolma dataset): Mine 1000 memorized sequences from Dolma.
      "Fixed-length windows [64 | 48] are sampled per document and a window is
      labeled memorized iff the teacher-forced argmax at each of the 48 suffix
      positions equals the gold token."
      Split: 500 train, 500 validation (used in Table 1).

  mine_dolma_memorization_1b:
    cmd: >-
      python memorization_kfac/data/mine_memorized_sequences.py
      --model ${model.name}
      --corpus dolma
      --prefix_len 64
      --suffix_len 48
      --n_sequences 650
      --output memorization_kfac/data/dolma_memorized_1b.json
      --split_ratio 0.81
    deps:
      - memorization_kfac/data/mine_memorized_sequences.py
    params:
      - model.name
    outs:
      - memorization_kfac/data/dolma_memorized_1b.json
      - memorization_kfac/data/dolma_memorized_1b_train.json
      - memorization_kfac/data/dolma_memorized_1b_val.json
    desc: |
      Paper Appendix F: Mine 650 memorized sequences from Dolma for 1B model.
      "We split the 650 Dolma sequences into 525 train and 125 validation."

  mine_historical_quotes_7b:
    cmd: >-
      python memorization_kfac/data/mine_historical_quotes.py
      --model ${model.name}
      --suffix_len 8
      --n_sequences 512
      --output memorization_kfac/data/historical_quotes_7b.json
    deps:
      - memorization_kfac/data/mine_historical_quotes.py
    params:
      - model.name
    outs:
      - memorization_kfac/data/historical_quotes_7b.json
    desc: |
      Paper Appendix B (Historical Quotes): Mine 512 memorized historical quotes.
      "For each quote (length ≥9 tokens), the prefix is all but the last 8 tokens
      and the suffix is the final 8. We greedily generate 8 tokens from the prefix
      and mark memorized on exact match."

  mine_historical_quotes_1b:
    cmd: >-
      python memorization_kfac/data/mine_historical_quotes.py
      --model ${model.name}
      --suffix_len 8
      --n_sequences 664
      --output memorization_kfac/data/historical_quotes_1b.json
    deps:
      - memorization_kfac/data/mine_historical_quotes.py
    params:
      - model.name
    outs:
      - memorization_kfac/data/historical_quotes_1b.json
    desc: |
      Paper Appendix F: Mine 664 memorized historical quotes for 1B model.

  # =============================================================================
  # Memorization Suppression Evaluation (Paper Table 1, Section 5.2)
  # =============================================================================
  # Reproduces Table 1 results: Strict/Loose accuracy, Levenshtein distance

  eval_memorization_baseline_7b:
    cmd: >-
      python memorization_kfac/evaluations/eval_memorization.py
      --model ${model.name}
      --dolma_data memorization_kfac/data/dolma_memorized_7b_val.json
      --quotes_data memorization_kfac/data/historical_quotes_7b.json
      --output memorization_kfac/metrics/memorization_baseline_7b.json
    deps:
      - memorization_kfac/evaluations/eval_memorization.py
      - memorization_kfac/data/dolma_memorized_7b_val.json
      - memorization_kfac/data/historical_quotes_7b.json
    params:
      - model.name
    metrics:
      - memorization_kfac/metrics/memorization_baseline_7b.json:
          cache: false
    desc: |
      Paper Table 1 (Baseline row): Evaluate baseline memorization on OLMo-2 7B.
      Expected results: Dolma Val Strict: 99.9%, Hist. Quotes Strict: 99.9%

  eval_memorization_kfac_7b:
    cmd: >-
      python memorization_kfac/evaluations/eval_memorization.py
      --model memorization_kfac/models/kfac_edited_7b
      --dolma_data memorization_kfac/data/dolma_memorized_7b_val.json
      --quotes_data memorization_kfac/data/historical_quotes_7b.json
      --output memorization_kfac/metrics/memorization_kfac_7b.json
    deps:
      - memorization_kfac/evaluations/eval_memorization.py
      - memorization_kfac/models/kfac_edited_7b
      - memorization_kfac/data/dolma_memorized_7b_val.json
      - memorization_kfac/data/historical_quotes_7b.json
    metrics:
      - memorization_kfac/metrics/memorization_kfac_7b.json:
          cache: false
    desc: |
      Paper Table 1 (K-FAC row): Evaluate K-FAC edited model on memorization.
      Expected results: Dolma Val Strict: 3.4%, Hist. Quotes Strict: 16.1%,
      measuring suppression of verbatim recitation.

  eval_memorization_baseline_1b:
    cmd: >-
      python memorization_kfac/evaluations/eval_memorization.py
      --model ${model.name}
      --dolma_data memorization_kfac/data/dolma_memorized_1b_val.json
      --quotes_data memorization_kfac/data/historical_quotes_1b.json
      --output memorization_kfac/metrics/memorization_baseline_1b.json
    deps:
      - memorization_kfac/evaluations/eval_memorization.py
      - memorization_kfac/data/dolma_memorized_1b_val.json
      - memorization_kfac/data/historical_quotes_1b.json
    params:
      - model.name
    metrics:
      - memorization_kfac/metrics/memorization_baseline_1b.json:
          cache: false
    desc: |
      Paper Appendix F (Table 5, Baseline row): Evaluate baseline OLMo-2 1B.
      Expected results: Dolma Val Strict: 98.46%, Hist. Quotes Strict: 98.5%

  eval_memorization_kfac_1b:
    cmd: >-
      python memorization_kfac/evaluations/eval_memorization.py
      --model memorization_kfac/models/kfac_edited_1b
      --dolma_data memorization_kfac/data/dolma_memorized_1b_val.json
      --quotes_data memorization_kfac/data/historical_quotes_1b.json
      --output memorization_kfac/metrics/memorization_kfac_1b.json
    deps:
      - memorization_kfac/evaluations/eval_memorization.py
      - memorization_kfac/models/kfac_edited_1b
      - memorization_kfac/data/dolma_memorized_1b_val.json
      - memorization_kfac/data/historical_quotes_1b.json
    metrics:
      - memorization_kfac/metrics/memorization_kfac_1b.json:
          cache: false
    desc: |
      Paper Appendix F (Table 5, K-FAC row): Evaluate K-FAC edited 1B model.
      Expected results: Dolma Val Strict: 2.8%, Hist. Quotes Strict: 27.7%

  # =============================================================================
  # Perplexity Evaluation (Paper Table 1, Section 5.2)
  # =============================================================================
  # Reproduces: "We compute perplexity on the first 200k tokens of the
  # held-out pile10k dataset"

  eval_perplexity_baseline_7b:
    cmd: >-
      python memorization_kfac/evaluations/eval_perplexity.py
      --model ${model.name}
      --data_path memorization_kfac/data/pile10k.txt
      --max_tokens 200000
      --output memorization_kfac/metrics/perplexity_baseline_7b.json
    deps:
      - memorization_kfac/evaluations/eval_perplexity.py
      - memorization_kfac/data/pile10k.txt
    params:
      - model.name
    metrics:
      - memorization_kfac/metrics/perplexity_baseline_7b.json:
          cache: false
    desc: |
      Paper Table 1: Compute perplexity on Pile 10k for baseline OLMo-2 7B.
      Expected result: 19.04 (from Table 1, Baseline row)

  eval_perplexity_kfac_7b:
    cmd: >-
      python memorization_kfac/evaluations/eval_perplexity.py
      --model memorization_kfac/models/kfac_edited_7b
      --data_path memorization_kfac/data/pile10k.txt
      --max_tokens 200000
      --output memorization_kfac/metrics/perplexity_kfac_7b.json
    deps:
      - memorization_kfac/evaluations/eval_perplexity.py
      - memorization_kfac/models/kfac_edited_7b
      - memorization_kfac/data/pile10k.txt
    metrics:
      - memorization_kfac/metrics/perplexity_kfac_7b.json:
          cache: false
    desc: |
      Paper Table 1: Compute perplexity on Pile 10k for K-FAC edited 7B.
      Expected result: 22.84 (from Table 1, K-FAC row)

  # =============================================================================
  # Benchmark Evaluations (Paper Section 6, Tables 8-10, Appendix I)
  # =============================================================================
  # Reproduces: "We use the OLMES evaluation suite to measure performance
  # on edited models across benchmarks"

  eval_benchmarks_baseline_7b:
    cmd: >-
      python memorization_kfac/evaluations/eval_benchmarks.py
      --model ${model.name}
      --benchmarks triviaqa relations popqa obqa csqa triviaqa_open obqa_fact boolq gsm8k winogrande mmlu_pro bigbench_hard
      --output memorization_kfac/metrics/benchmarks_baseline_7b.json
    deps:
      - memorization_kfac/evaluations/eval_benchmarks.py
    params:
      - model.name
    metrics:
      - memorization_kfac/metrics/benchmarks_baseline_7b.json:
          cache: false
    desc: |
      Paper Tables 8-10 (Appendix I, Baseline column): Evaluate baseline OLMo-2 7B
      on multiple benchmarks using OLMES suite.
      Covers: TriviaQA (0.780), Relations (74.855), PopQA (0.807), OBQA (0.804),
      CSQA (0.751), GSM8K (0.675), Winogrande (0.772), MMLU-Pro (0.499), etc.

  eval_benchmarks_kfac_7b:
    cmd: >-
      python memorization_kfac/evaluations/eval_benchmarks.py
      --model memorization_kfac/models/kfac_edited_7b
      --benchmarks triviaqa relations popqa obqa csqa triviaqa_open obqa_fact boolq gsm8k winogrande mmlu_pro bigbench_hard
      --output memorization_kfac/metrics/benchmarks_kfac_7b.json
    deps:
      - memorization_kfac/evaluations/eval_benchmarks.py
      - memorization_kfac/models/kfac_edited_7b
    metrics:
      - memorization_kfac/metrics/benchmarks_kfac_7b.json:
          cache: false
    desc: |
      Paper Tables 8-10 (Appendix I, K-FAC column): Evaluate K-FAC edited model.
      Expected results show: TriviaQA (0.648), Relations (64.390), GSM8K (0.447),
      MMLU-Pro Math (0.158), demonstrating spectrum from preserved logical
      reasoning to degraded arithmetic and fact retrieval (Section 6).

  eval_simplemath_baseline_7b:
    cmd: >-
      python memorization_kfac/evaluations/eval_simplemath.py
      --model ${model.name}
      --output memorization_kfac/metrics/simplemath_baseline_7b.json
    deps:
      - memorization_kfac/evaluations/eval_simplemath.py
    params:
      - model.name
    metrics:
      - memorization_kfac/metrics/simplemath_baseline_7b.json:
          cache: false
    desc: |
      Paper Section 6 (SimpleMath dataset): Evaluate baseline on two-digit
      addition/subtraction problems fed 5-shot.
      Custom dataset demonstrating arithmetic brittleness after K-FAC edit.

  eval_simplemath_kfac_7b:
    cmd: >-
      python memorization_kfac/evaluations/eval_simplemath.py
      --model memorization_kfac/models/kfac_edited_7b
      --output memorization_kfac/metrics/simplemath_kfac_7b.json
    deps:
      - memorization_kfac/evaluations/eval_simplemath.py
      - memorization_kfac/models/kfac_edited_7b
    metrics:
      - memorization_kfac/metrics/simplemath_kfac_7b.json:
          cache: false
    desc: |
      Paper Figure 3: SimpleMath performance after K-FAC edit.
      Expected to show large drop (66-74% retention), demonstrating that
      arithmetic relies heavily on low-curvature weight components.

  # =============================================================================
  # Legacy tasks (implementation comparison)
  # =============================================================================

  eval_kfac_edit:
    cmd: >-
      python memorization_kfac/evaluations/eval_mem_kfac.py
      --model-size ${model.size}
      --layers-json ${kfac_edit.layers_json}
      --use-cache
    deps:
      - memorization_kfac/evaluations/eval_mem_kfac.py
      - "memorization_kfac/data/kfac_factors/olmo2_${model.size}"
    metrics:
      - memorization_kfac/metrics/kfac_eval_results.json:
          cache: false
    desc: |
      Apply K-FAC curvature-based weight editing and evaluate memorization.
      Keeps top curvature mass to suppress memorization while
      preserving shared structure. Outputs perplexity and memorization metrics.

  convert_bergson_to_original:
    cmd: >-
      python memorization_kfac/data/convert_bergson_to_original.py
      --bergson_dir memorization_kfac/data/kfac_factors_bergson
      --output_dir memorization_kfac/data/kfac_factors_bergson_converted
    deps:
      - memorization_kfac/data/convert_bergson_to_original.py
      - memorization_kfac/data/kfac_factors_bergson
    outs:
      - memorization_kfac/data/kfac_factors_bergson_converted
    desc: |
      Convert bergson KFAC output to original format (Option A).
      Handles:
      - Key name mapping: layers.N.mlp.gate_proj → blkN.gate
      - Normalization: raw sums → normalized by n_tokens
      - Format conversion: safetensors → .pt

  compare_kfac_implementations:
    cmd: >-
      python memorization_kfac/data/compare_kfac_implementations.py
      --original_dir "memorization_kfac/data/kfac_factors/olmo2_${model.size}"
      --bergson_converted_dir memorization_kfac/data/kfac_factors_bergson_converted
      --output_json memorization_kfac/metrics/kfac_comparison_results.json
    deps:
      - memorization_kfac/data/compare_kfac_implementations.py
      - "memorization_kfac/data/kfac_factors/olmo2_${model.size}"
      - memorization_kfac/data/kfac_factors_bergson_converted
    params:
      - model.size
    metrics:
      - memorization_kfac/metrics/kfac_comparison_results.json:
          cache: false
    desc: |
      Compare K-FAC factors from original and bergson implementations.
      Computes similarity metrics:
      - Frobenius norm difference
      - Relative error
      - Cosine similarity
      - Max/mean absolute difference
      Reports aggregate statistics across all modules.
