stages:
  # =============================================================================
  # Data Preparation
  # =============================================================================

  prepare_pile10k:
    cmd:
      - python memorization_kfac/data/prepare_pile10k.py
    deps:
      - memorization_kfac/data/prepare_pile10k.py
    outs:
      - memorization_kfac/data/pile10k_None.txt
    desc: |
      Download and prepare pile10k dataset from HuggingFace (NeelNanda/pile-10k).
      This dataset is used for nDCG evaluation in the validation stages.

  prepare_pile10k_cache:
    cmd:
      - python memorization_kfac/data/prepare_pile10k_cache.py
    deps:
      - memorization_kfac/data/prepare_pile10k_cache.py
      - memorization_kfac/data/pile10k_None.txt
    outs:
      - memorization_kfac/evaluations/bsn_dependencies/data/olmo2_clean_pt_cache_112.pt
    desc: |
      Generate pre-tokenized cache for pile10k perplexity evaluation.
      Creates a .pt file with tokenized pile10k data in blocks of size 112.
      This is used for BSN-style perplexity evaluation.

  # =============================================================================
  # K-FAC Factor Collection (Paper Section 3.2, Equation 1)
  # =============================================================================
  # Reproduces: "We collect these factors for the MLP projections (gate_proj,
  # up_proj, down_proj) by streaming ~20M tokens from Dolmino/OLMo mixtures
  # with sequence length 512 under next-token cross-entropy."

  collect_kfac_paper_7b:
    cmd:
      - python memorization_kfac/data/collect_kfac_multilayer.py
        --model allenai/OLMo-2-1124-7B
        --device cuda
        --dtype bfloat16
        --corpus dolmo
        --nbytes 100000000
        --seq_len 512
        --batch_size 24
        --layers_per_pass 3
        --target_blocks 23 24 25
        --save_dir memorization_kfac/data/kfac_factors_paper/olmo2_7b
        --sample_labels
    deps:
      - memorization_kfac/data/collect_kfac_multilayer.py
    outs:
      - memorization_kfac/data/kfac_factors_paper/olmo2_7b
    desc: |
      Paper Section 3.2 (7B model): Collect K-FAC factors for Table 1 reproduction.

      Settings from paper:
      - Model: OLMo-2 7B
      - Layers: 23, 24, 25 (to be edited at 60% energy)
      - Data: ~100MB (~20M tokens) from Dolmino/OLMo mixtures
      - Sequence length: 512
      - Corpus: dolmo

      Computes A = E[aa^T] and G = E[gg^T] for gate_proj, up_proj, down_proj
      in each target layer.

  collect_kfac_paper_7b_sample:
    cmd:
      - python memorization_kfac/data/collect_kfac_multilayer.py
        --model allenai/OLMo-2-1124-7B
        --device cuda
        --dtype bfloat16
        --corpus dolmo
        --nbytes 100000000
        --seq_len 512
        --batch_size 24
        --layers_per_pass 3
        --target_blocks 23 24 25
        --save_dir memorization_kfac/data/kfac_factors_paper_sample/olmo2_7b
    deps:
      - memorization_kfac/data/collect_kfac_multilayer.py
    outs:
      - memorization_kfac/data/kfac_factors_paper_sample/olmo2_7b


  collect_kfac_paper_1b:
    cmd:
      - python memorization_kfac/data/collect_kfac_multilayer.py
        --model allenai/OLMo-2-0425-1B
        --device cuda
        --dtype bfloat16
        --corpus dolmo
        --nbytes 100000000
        --seq_len 512
        --batch_size 32
        --layers_per_pass 3
        --target_blocks 13 14 15
        --save_dir memorization_kfac/data/kfac_factors_paper/olmo2_1b
    deps:
      - memorization_kfac/data/collect_kfac_multilayer.py
    outs:
      - memorization_kfac/data/kfac_factors_paper/olmo2_1b
    desc: |
      Paper Table 5/Appendix F (1B model): Collect K-FAC factors for reproduction.

      Settings:
      - Model: OLMo-2 1B
      - Layers: 13, 14, 15 (late layers, equivalent to 7B's 23-25)
      - Data: ~100MB (~20M tokens) from Dolmino/OLMo mixtures
      - Sequence length: 512
      - Corpus: dolmo

  collect_kfac_paper_1b_sample:
    cmd:
      - python memorization_kfac/data/collect_kfac_multilayer.py
        --model allenai/OLMo-2-0425-1B
        --device cuda
        --dtype bfloat16
        --corpus dolmo
        --nbytes 100000000
        --seq_len 512
        --batch_size 32
        --layers_per_pass 3
        --target_blocks 13 14 15
        --save_dir memorization_kfac/data/kfac_factors_paper_sample/olmo2_1b
        --sample_labels
    deps:
      - memorization_kfac/data/collect_kfac_multilayer.py
    outs:
      - memorization_kfac/data/kfac_factors_paper_sample/olmo2_1b


  # --- Bergson implementation of paper collection (for comparison) ---

  collect_kfac_paper_7b_bergson:
    cmd:
      - python memorization_kfac/data/collect_kfac_bergson.py
        --model allenai/OLMo-2-1124-7B
        --device cuda
        --dtype bfloat16
        --corpus dolmo
        --nbytes 100000000
        --seq_len 512
        --batch_size 24
        --layers_per_pass 1
        --target_blocks 23 24 25
        --save_dir memorization_kfac/data/kfac_factors_paper_bergson/olmo2_7b
        --sample_labels
        #--kfac-only
    deps:
      - memorization_kfac/data/collect_kfac_bergson.py
      - bergson/hessians/collector.py
      - bergson/hessians/sharded_computation.py
    outs:
      - memorization_kfac/data/kfac_factors_paper_bergson/olmo2_7b
    desc: |
      Paper Section 3.2 (7B model): Collect K-FAC factors using BERGSON implementation.

      Same parameters as collect_kfac_paper_7b but using bergson's collector.
      Used to validate bergson implementation matches original.

      Settings from paper:
      - Model: OLMo-2 7B
      - Layers: 23, 24, 25
      - Data: ~100MB (~20M tokens) from Dolmino/OLMo mixtures
      - Sequence length: 512
      - --kfac-only: Use KFAC (no eigenvalue correction)

  convert_bergson_paper_7b:
    cmd: >-
      python memorization_kfac/data/convert_bergson_to_original.py --bergson_dir memorization_kfac/data/kfac_factors_paper_bergson/olmo2_7b --output_dir memorization_kfac/data/kfac_factors_paper_bergson_converted/olmo2_7b
    deps:
      - memorization_kfac/data/convert_bergson_to_original.py
      - memorization_kfac/data/kfac_factors_paper_bergson/olmo2_7b
    outs:
      - memorization_kfac/data/kfac_factors_paper_bergson_converted/olmo2_7b
    desc: |
      Convert bergson paper 7B K-FAC output to original format for comparison.
      Handles key mapping, normalization, and format conversion.

  compare_kfac_paper_7b:
    cmd: >-
      python memorization_kfac/data/compare_kfac_implementations.py
      --original_dir memorization_kfac/data/kfac_factors_paper/olmo2_7b
      --bergson_converted_dir memorization_kfac/data/kfac_factors_paper_bergson_converted/olmo2_7b
      --output_json memorization_kfac/metrics/kfac_comparison_paper_7b.json
    deps:
      - memorization_kfac/data/compare_kfac_implementations.py
      - memorization_kfac/data/kfac_factors_paper/olmo2_7b
      - memorization_kfac/data/kfac_factors_paper_bergson_converted/olmo2_7b
    metrics:
      - memorization_kfac/metrics/kfac_comparison_paper_7b.json:
          cache: false
    desc: |
      Compare K-FAC factors from original vs bergson implementations (7B paper settings).

      Uses exact paper parameters (layers 23-25, 100MB dolmo corpus) to validate
      that bergson's implementation produces equivalent results.

      Computes similarity metrics:
      - Frobenius norm difference
      - Relative error
      - Cosine similarity
      - Max/mean absolute difference

      If implementations match, relative errors should be very small (<1%).

  collect_kfac_paper_1b_bergson:
    cmd:
      - python memorization_kfac/data/collect_kfac_bergson.py
        --model allenai/OLMo-2-0425-1B
        --device cuda
        --dtype bfloat16
        --corpus dolmo
        --nbytes 100000000
        --seq_len 512
        --batch_size 32
        --layers_per_pass 1
        --target_blocks 13 14 15
        --save_dir memorization_kfac/data/kfac_factors_paper_bergson/olmo2_1b
        --kfac-only
    deps:
      - memorization_kfac/data/collect_kfac_bergson.py
      - bergson/hessians/collector.py
      - bergson/hessians/sharded_computation.py
    outs:
      - memorization_kfac/data/kfac_factors_paper_bergson/olmo2_1b
    desc: |
      Paper Table 5 (1B model): Collect K-FAC factors using BERGSON implementation.

      Same parameters as collect_kfac_paper_1b but using bergson's collector.
      Used to validate bergson implementation matches original.

      Settings:
      - Model: OLMo-2 1B
      - Layers: 13, 14, 15 (late layers, equivalent to 7B's 23-25)
      - Data: ~100MB (~20M tokens) from Dolmino/OLMo mixtures
      - --kfac-only: Use KFAC (no eigenvalue correction)

  convert_bergson_paper_1b:
    cmd: >-
      python memorization_kfac/data/convert_bergson_to_original.py
      --bergson_dir memorization_kfac/data/kfac_factors_paper_bergson/olmo2_1b
      --output_dir memorization_kfac/data/kfac_factors_paper_bergson_converted/olmo2_1b
    deps:
      - memorization_kfac/data/convert_bergson_to_original.py
      - memorization_kfac/data/kfac_factors_paper_bergson/olmo2_1b
    outs:
      - memorization_kfac/data/kfac_factors_paper_bergson_converted/olmo2_1b
    desc: |
      Convert bergson paper 1B K-FAC output to original format for comparison.
      Handles key mapping, normalization, and format conversion.

  compare_kfac_paper_1b:
    cmd: >-
      python memorization_kfac/data/compare_kfac_implementations.py
      --original_dir memorization_kfac/data/kfac_factors_paper/olmo2_1b
      --bergson_converted_dir memorization_kfac/data/kfac_factors_paper_bergson_converted/olmo2_1b
      --output_json memorization_kfac/metrics/kfac_comparison_paper_1b.json
    deps:
      - memorization_kfac/data/compare_kfac_implementations.py
      - memorization_kfac/data/kfac_factors_paper/olmo2_1b
      - memorization_kfac/data/kfac_factors_paper_bergson_converted/olmo2_1b
    metrics:
      - memorization_kfac/metrics/kfac_comparison_paper_1b.json:
          cache: false
    desc: |
      Compare K-FAC factors from original vs bergson implementations (1B paper settings).

      Uses paper parameters (layers 13-15, 100MB dolmo corpus) to validate
      that bergson's implementation produces equivalent results.

      If implementations match, relative errors should be very small (<1%).

  # --- Development/experimental K-FAC collection tasks ---

  collect_kfac_bergson:
    cmd: >-
      python memorization_kfac/data/collect_kfac_bergson.py
      --model ${model.name}
      --device ${collect_kfac.device}
      --dtype ${collect_kfac.dtype}
      --corpus ${collect_kfac.corpus}
      --nbytes ${collect_kfac.nbytes}
      --seq_len ${collect_kfac.seq_len}
      --batch_size ${collect_kfac.batch_size}
      --layers_per_pass ${collect_kfac.layers_per_pass}
      --target_blocks ${collect_kfac.target_blocks}
      --save_dir memorization_kfac/data/kfac_factors_bergson
      ${collect_kfac.sample_labels}
    deps:
      - memorization_kfac/data/collect_kfac_bergson.py
      - bergson/hessians/collector.py
      - bergson/hessians/sharded_computation.py
    params:
      - model.name
      - collect_kfac
    outs:
      - memorization_kfac/data/kfac_factors_bergson
    desc: |
      Development: Collect K-FAC factors using bergson's implementation.
      Uses parameters from params.yaml for experimentation.

  collect_kfac_factors:
    cmd:
      - python memorization_kfac/data/collect_kfac_multilayer.py
        --model ${model.name}
        --device ${collect_kfac.device}
        --dtype ${collect_kfac.dtype}
        --corpus ${collect_kfac.corpus}
        --nbytes ${collect_kfac.nbytes}
        --seq_len ${collect_kfac.seq_len}
        --batch_size ${collect_kfac.batch_size}
        --layers_per_pass ${collect_kfac.layers_per_pass}
        --target_blocks ${collect_kfac.target_blocks}
        --save_dir "memorization_kfac/data/kfac_factors/olmo2_${model.size}"
        ${collect_kfac.sample_labels}
    deps:
      - memorization_kfac/data/collect_kfac_multilayer.py
    outs:
      - "memorization_kfac/data/kfac_factors/olmo2_${model.size}"
    desc: |
      Development: Original K-FAC collection implementation.
      Uses parameters from params.yaml for experimentation.

  # =============================================================================
  # K-FAC Weight Editing & Evaluation (Paper Section 5, Table 1)
  # =============================================================================
  # Reproduces Table 1: "In LMs we edit layers 23, 24, and 25 at 60% energy
  # retained in the up and gate projections in MLPs."
  #
  # Uses eval_mem_kfac.py which:
  # - Applies K-FAC edits to specified layers
  # - Evaluates memorization (Dolma & Quotes datasets)
  # - Computes perplexity and nDCG@10
  # - Saves edited model

  paper_table1_7b:
    cmd: >-
      MEM_KFAC_FACTORS_ROOT=memorization_kfac/data/kfac_factors_paper
      MEM_KFAC_CACHE_DIR=memorization_kfac/cache/kfac_weights_paper_7b
      CUDA_VISIBLE_DEVICES=0
      python memorization_kfac/evaluations/eval_mem_kfac.py
      --model-size 7b
      --layers-json '{"23": {"gate": 0.60, "up": 0.60, "down": 1.0}, "24": {"gate": 0.60, "up": 0.60, "down": 1.0}, "25": {"gate": 0.60, "up": 0.60, "down": 1.0}}'
      --use-cache --refresh-cache
      --perplexity
      --results-dir memorization_kfac/metrics
      --results-tag table1_7b
    deps:
      - memorization_kfac/evaluations/eval_mem_kfac.py
      - memorization_kfac/data/kfac_factors_paper/olmo2_7b
      - memorization_kfac/data/pile10k_None.txt
      - memorization_kfac/evaluations/bsn_dependencies/data/olmo2_clean_pt_cache_112.pt
    outs:
      - memorization_kfac/cache/kfac_weights_paper_7b:
          cache: true
    metrics:
      - memorization_kfac/metrics/kfac_eval_log_7b_table1_7b.jsonl:
          cache: false
    desc: |
      Paper Table 1 (7B model, all columns): Apply K-FAC edit and evaluate.

      Settings (Appendix D.1): Layers 23-25 at 60% energy in up/gate projections.

      Expected results (Table 1, K-FAC row):
      - Dolma Val Strict: 3.4% (down from 99.9% baseline)
      - Dolma Val Loose: 8.8%
      - Dolma Avg Lev: 0.704
      - Historical Quotes Strict: 16.1% (down from 99.9% baseline)
      - Historical Quotes Loose: 23.8%
      - Historical Quotes Avg Lev: 0.625
      - Pile 10k Perplexity: 22.84 (up from 19.04 baseline)

      Also computes: nDCG@10 (expected: 0.91)

  paper_table1_7b_sample:
    cmd: >-
      MEM_KFAC_FACTORS_ROOT=memorization_kfac/data/kfac_factors_paper_sample
      MEM_KFAC_CACHE_DIR=memorization_kfac/cache/kfac_weights_paper_7b_sample
      CUDA_VISIBLE_DEVICES=0
      python memorization_kfac/evaluations/eval_mem_kfac.py
      --model-size 7b
      --layers-json '{"23": {"gate": 0.60, "up": 0.60, "down": 1.0}, "24": {"gate": 0.60, "up": 0.60, "down": 1.0}, "25": {"gate": 0.60, "up": 0.60, "down": 1.0}}'
      --use-cache --refresh-cache
      --perplexity
      --results-dir memorization_kfac/metrics_sample
      --results-tag table1_7b
    deps:
      - memorization_kfac/evaluations/eval_mem_kfac.py
      - memorization_kfac/data/kfac_factors_paper_sample/olmo2_7b
      - memorization_kfac/data/pile10k_None.txt
      - memorization_kfac/evaluations/bsn_dependencies/data/olmo2_clean_pt_cache_112.pt
    outs:
      - memorization_kfac/cache/kfac_weights_paper_7b_sample:
          cache: true
    metrics:
      - memorization_kfac/metrics_sample/kfac_eval_log_7b_table1_7b.jsonl:
          cache: false

  paper_table1_7b_bergson:
    #CUDA_VISIBLE_DEVICES=0
    cmd: >-
      MEM_KFAC_FACTORS_ROOT=memorization_kfac/data/kfac_factors_paper_bergson_converted MEM_KFAC_CACHE_DIR=memorization_kfac/cache/kfac_weights_paper_bergson python memorization_kfac/evaluations/eval_mem_kfac.py --model-size 7b --layers-json '{"23": {"gate": 0.60, "up": 0.60, "down": 1.0}, "24": {"gate": 0.60, "up": 0.60, "down": 1.0}, "25": {"gate": 0.60, "up": 0.60, "down": 1.0}}' --use-cache --refresh-cache --perplexity --results-dir memorization_kfac/metrics_bergson --results-tag table1_7b
    deps:
      - memorization_kfac/evaluations/eval_mem_kfac.py
      - memorization_kfac/data/kfac_factors_paper_bergson_converted/olmo2_7b
      - memorization_kfac/data/pile10k_None.txt
      - memorization_kfac/evaluations/bsn_dependencies/data/olmo2_clean_pt_cache_112.pt
    outs:
      - memorization_kfac/cache/kfac_weights_paper_bergson:
          cache: true
    metrics:
      - memorization_kfac/metrics_bergson/kfac_eval_log_7b_table1_7b.jsonl:
          cache: false


  paper_table1_1b:
    cmd: >-
      MEM_KFAC_FACTORS_ROOT=memorization_kfac/data/kfac_factors_paper
      MEM_KFAC_CACHE_DIR=memorization_kfac/cache/kfac_weights_paper_1b
      CUDA_VISIBLE_DEVICES=0
      python memorization_kfac/evaluations/eval_mem_kfac.py
      --model-size 1b
      --layers-json '{"13": {"gate": 0.60, "up": 0.60, "down": 1.0}, "14": {"gate": 0.60, "up": 0.60, "down": 1.0}, "15": {"gate": 0.60, "up": 0.60, "down": 1.0}}'
      --use-cache --refresh-cache
      --perplexity
      --results-dir memorization_kfac/metrics
      --results-tag table1_1b
    deps:
      - memorization_kfac/evaluations/eval_mem_kfac.py
      - memorization_kfac/data/kfac_factors_paper/olmo2_1b
      - memorization_kfac/data/pile10k_None.txt
      - memorization_kfac/evaluations/bsn_dependencies/data/olmo2_clean_pt_cache_112.pt
    outs:
      - memorization_kfac/cache/kfac_weights_paper_1b:
          cache: true
    metrics:
      - memorization_kfac/metrics/kfac_eval_log_1b_table1_1b.jsonl:
          cache: false
    desc: |
      Paper Table 5 (Appendix F, 1B model): Apply K-FAC edit and evaluate.

      Settings: Layers 13-15 (late layers, similar to 7B) at 60% energy
      in up/gate projections. Note: Paper doesn't specify exact 1B settings,
      using equivalent to 7B (late layers, 60% energy).

      Expected results (Table 5, K-FAC row):
      - Dolma Val Strict: 2.8% (down from 98.46% baseline)
      - Dolma Val Loose: 7.2%
      - Dolma Avg Lev: 0.761
      - Historical Quotes Strict: 27.7% (down from 98.5% baseline)
      - Historical Quotes Loose: 39.9%
      - Historical Quotes Avg Lev: 0.470
      - Pile 10k Perplexity: 26.53 (up from 23.19 baseline)

  paper_table1_1b_sample:
    cmd: >-
      MEM_KFAC_FACTORS_ROOT=memorization_kfac/data/kfac_factors_paper_sample
      MEM_KFAC_CACHE_DIR=memorization_kfac/cache/kfac_weights_paper_1b_sample
      CUDA_VISIBLE_DEVICES=0
      python memorization_kfac/evaluations/eval_mem_kfac.py
      --model-size 1b
      --layers-json '{"13": {"gate": 0.60, "up": 0.60, "down": 1.0}, "14": {"gate": 0.60, "up": 0.60, "down": 1.0}, "15": {"gate": 0.60, "up": 0.60, "down": 1.0}}'
      --use-cache --refresh-cache
      --perplexity
      --results-dir memorization_kfac/metrics_sample
      --results-tag table1_1b
    deps:
      - memorization_kfac/evaluations/eval_mem_kfac.py
      - memorization_kfac/data/kfac_factors_paper_sample/olmo2_1b
      - memorization_kfac/data/pile10k_None.txt
      - memorization_kfac/evaluations/bsn_dependencies/data/olmo2_clean_pt_cache_112.pt
    outs:
      - memorization_kfac/cache/kfac_weights_paper_1b_sample:
          cache: true
    metrics:
      - memorization_kfac/metrics_sample/kfac_eval_log_1b_table1_1b.jsonl:
          cache: false


  # =============================================================================
  # Result Validation (Compare against Paper Values)
  # =============================================================================
  # Computes absolute and relative errors between experimental results and
  # expected values from the paper. Flags metrics outside 5% tolerance.

  validate_table1_7b:
    cmd: >-
      python memorization_kfac/evaluations/validate_paper_results.py
      --results-file memorization_kfac/metrics/kfac_eval_log_7b_table1_7b.jsonl
      --model-size 7b
      --tolerance 0.05
      --output memorization_kfac/metrics/validation_table1_7b.json
    deps:
      - memorization_kfac/evaluations/validate_paper_results.py
      - memorization_kfac/metrics/kfac_eval_log_7b_table1_7b.jsonl
    metrics:
      - memorization_kfac/metrics/validation_table1_7b.json:
          cache: false
    desc: |
      Validate Table 1 (7B) results against paper values.

      Computes for each metric:
      - Absolute error: actual - expected
      - Relative error: (actual - expected) / expected
      - Percentage relative error

      Flags metrics with >5% relative error as issues.

      Validates:
      - Dolma: strict_acc, loose_acc, avg_levenshtein
      - Quotes: strict_acc, loose_acc, avg_levenshtein
      - Perplexity (Pile 10k)
      - nDCG@10

  validate_table1_7b_bergson:
    cmd: >-
      python memorization_kfac/evaluations/validate_paper_results.py
      --results-file memorization_kfac/metrics_bergson/kfac_eval_log_7b_table1_7b.jsonl
      --model-size 7b
      --tolerance 0.05
      --output memorization_kfac/metrics_bergson/validation_table1_7b.json
    deps:
      - memorization_kfac/evaluations/validate_paper_results.py
      - memorization_kfac/metrics_bergson/kfac_eval_log_7b_table1_7b.jsonl
    metrics:
      - memorization_kfac/metrics_bergson/validation_table1_7b.json:
          cache: false


  validate_table1_1b:
    cmd: >-
      python memorization_kfac/evaluations/validate_paper_results.py
      --results-file memorization_kfac/metrics/kfac_eval_log_1b_table1_1b.jsonl
      --model-size 1b
      --tolerance 0.05
      --output memorization_kfac/metrics/validation_table1_1b.json
    deps:
      - memorization_kfac/evaluations/validate_paper_results.py
      - memorization_kfac/metrics/kfac_eval_log_1b_table1_1b.jsonl
    metrics:
      - memorization_kfac/metrics/validation_table1_1b.json:
          cache: false
    desc: |
      Validate Table 5/Appendix F (1B) results against paper values.

      Same validation as 7B model but with 1B expected values.
      Flags metrics with >5% relative error as issues.

  # =============================================================================
  # Figure 2: K-FAC Eigenvector Activation Ratios (Paper Section 4)
  # =============================================================================
  # Reproduces Figure 2: "K-FAC shows a more salient divergence between
  # different parts of the eigenspectrum on memorized and clean data."

  plot_figure2_7b:
    cmd: >-
      python memorization_kfac/evaluations/plot_figure2_activation_ratios.py
      --model-size 7b
      --kfac-dir memorization_kfac/data/kfac_factors_paper/olmo2_7b
      --projection up
      --n-samples 100
      --batch-size 8
      --output-dir memorization_kfac/plots/figure2_7b
    deps:
      - memorization_kfac/evaluations/plot_figure2_activation_ratios.py
      - memorization_kfac/data/kfac_factors_paper/olmo2_7b
    plots:
      - memorization_kfac/plots/figure2_7b:
          cache: false
    desc: |
      Paper Figure 2 (Section 4): K-FAC eigenvector activation ratios for 7B model.

      Methodology:
      - Load pre-computed K-FAC factors (A and G matrices)
      - Order A's eigenvectors by FIM: Σ_i λ_i^G * λ_j^A
      - Collect activations on memorized vs clean data (no gradients)
      - Project activations onto eigenbasis of A
      - Compute memorized/clean ratio for each percentile band

      Plots 4 lines (percentile bands):
      - Top 10% of eigenvectors
      - 10-25% range
      - 25-50% range
      - Bottom 50%

      X-axis: MLP layer
      Y-axis: Memorized/Clean activation ratio

      Expected (layer 22, from paper):
      - Bottom 50%: 23.1% higher on memorized (ratio ≈ 1.231)
      - Top 10%: 26% higher on clean (ratio ≈ 0.740)

  plot_figure2_1b:
    cmd: >-
      python memorization_kfac/evaluations/plot_figure2_activation_ratios.py
      --model-size 1b
      --kfac-dir memorization_kfac/data/kfac_factors_paper/olmo2_1b
      --projection up
      --n-samples 100
      --batch-size 8
      --output-dir memorization_kfac/plots/figure2_1b
    deps:
      - memorization_kfac/evaluations/plot_figure2_activation_ratios.py
      - memorization_kfac/data/kfac_factors_paper/olmo2_1b
    plots:
      - memorization_kfac/plots/figure2_1b:
          cache: false
    desc: |
      Paper Figure 2 (Section 4): K-FAC eigenvector activation ratios for 1B model.
      Same analysis as 7B but for smaller model.

